<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clip Cutter</title>
<style>
  :root { --bg: #f6f7f9; --fg: #0b1220; --muted: #5b6474; --line: #e3e7ee; --accent: #2563eb; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0f17; --fg: #e8ecf3; --muted: #9aa4b5; --line: #222a37; --card: #121826; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Inter, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin: 10px 0 6px; }
  input[type=number], select { width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  video { width: 100%; max-height: 360px; background: #000; border-radius: 10px; }
  button { appearance: none; border: 0; background: var(--accent); color: #fff; font: 600 15px system-ui; padding: 11px 18px; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 10px; }
  #log { color: var(--muted); white-space: pre-wrap; font-size: 13px; }
  a#dl { display: inline-block; margin-top: 10px; font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Clip Cutter</h1>
  <p class="sub">Trim, reframe to 9:16 / 1:1 / 16:9 and export MP4 entirely in your browser (Mediabunny + WebCodecs). Nothing is uploaded.</p>

  <div class="card">
    <label for="file">Source video</label>
    <input id="file" type="file" accept="video/*" />
    <video id="preview" controls playsinline></video>
  </div>

  <div class="card">
    <div class="row">
      <div><label for="start">Start (s)</label><input id="start" type="number" min="0" step="0.1" value="0" /></div>
      <div><label for="end">End (s)</label><input id="end" type="number" min="0" step="0.1" value="15" /></div>
    </div>
    <div class="row">
      <div>
        <label for="format">Output</label>
        <select id="format">
          <option value="1080x1920">9:16 · 1080×1920 (TikTok / Reels / Shorts)</option>
          <option value="1080x1080">1:1 · 1080×1080</option>
          <option value="1920x1080">16:9 · 1920×1080 (YouTube)</option>
          <option value="keep">Keep original framing</option>
        </select>
      </div>
      <div>
        <label for="pos">Crop position (0 = left, 1 = right)</label>
        <input id="pos" type="number" min="0" max="1" step="0.05" value="0.5" />
      </div>
    </div>
    <p><button id="go" disabled>Export MP4</button></p>
    <progress id="bar" max="1" value="0"></progress>
    <div id="log"></div>
    <a id="dl" hidden>Download clip</a>
  </div>
</main>

<script type="module">
// Local copy first (npm install in this folder), CDN fallback when opened elsewhere.
let mb;
try { mb = await import('./node_modules/mediabunny/dist/bundles/mediabunny.min.mjs'); }
catch { mb = await import('https://cdn.jsdelivr.net/npm/mediabunny@1.66.2/dist/bundles/mediabunny.min.mjs'); }
const { Input, Output, Conversion, ALL_FORMATS, BlobSource, Mp4OutputFormat, BufferTarget } = mb;

const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent += m + '\n'; };
let file = null;
let endEdited = false;
$('end').addEventListener('input', () => { endEdited = true; });

$('file').addEventListener('change', () => {
  file = $('file').files[0] || null;
  $('go').disabled = !file;
  if (file) {
    $('preview').src = URL.createObjectURL(file);
    // Suggest a 15 s clip, but never overwrite a value the user already typed.
    $('preview').onloadedmetadata = () => { if (!endEdited) $('end').value = Math.min(15, $('preview').duration).toFixed(1); };
  }
});

async function exportClip() {
  $('go').disabled = true; $('dl').hidden = true; $('log').textContent = ''; $('bar').value = 0;
  try {
    const input = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
    const track = await input.getPrimaryVideoTrack();
    const W = await track.getDisplayWidth(), H = await track.getDisplayHeight();
    const start = Number($('start').value), end = Number($('end').value);
    if (!(end > start)) throw new Error(`End (${end}s) must be after start (${start}s).`);
    const fmt = $('format').value;
    const video = {};
    if (fmt !== 'keep') {
      const [ow, oh] = fmt.split('x').map(Number);
      // Largest crop of the output aspect ratio that fits the source, placed by the slider.
      let cw = W, ch = Math.round(W * oh / ow);
      if (ch > H) { ch = H; cw = Math.round(H * ow / oh); }
      const left = Math.round((W - cw) * Math.min(1, Math.max(0, Number($('pos').value))));
      const top = Math.round((H - ch) / 2);
      Object.assign(video, { crop: { left, top, width: cw, height: ch }, width: ow, height: oh, fit: 'fill' });
    }
    const make = async (codec) => {
      const output = new Output({ format: new Mp4OutputFormat({ fastStart: 'in-memory' }), target: new BufferTarget() });
      const conversion = await Conversion.init({ input, output, trim: { start, end }, video: codec ? { ...video, codec } : video });
      return { output, conversion };
    };
    // Prefer H.264 (best platform compatibility); fall back to whatever this browser can encode.
    let { output, conversion } = await make('avc');
    if (!conversion.isValid) { log('H.264 encoder unavailable in this browser, using its default codec.'); ({ output, conversion } = await make(null)); }
    if (!conversion.isValid) throw new Error('This browser cannot encode this file: ' + JSON.stringify(conversion.discardedTracks.map((d) => d.reason)));
    conversion.onProgress = (p) => { $('bar').value = p; };
    await conversion.execute();
    const blob = new Blob([output.target.buffer], { type: 'video/mp4' });
    const a = $('dl');
    a.href = URL.createObjectURL(blob);
    a.download = `${file.name.replace(/\.[^.]+$/, '')}_${start}-${end}_${fmt}.mp4`;
    a.hidden = false;
    log(`Done: ${(blob.size / 1e6).toFixed(1)} MB`);
    window.__result = { size: blob.size, name: a.download };
  } catch (e) {
    log('Error: ' + e.message);
    window.__result = { error: e.message };
  } finally {
    $('go').disabled = false;
  }
}
$('go').addEventListener('click', exportClip);
</script>
</body>
</html>
